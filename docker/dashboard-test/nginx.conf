server {
 listen 80;
 root /usr/share/nginx/html;
 # Same-origin bearer-only proxy, isolated from the habitual backend CORS configuration.
 proxy_set_header Origin "";
 location = /api/abogados/me { limit_except GET { deny all; } proxy_pass http://abogados-dashboard:8082; }
 location /api/abogados/me/dashboard/ { limit_except GET { deny all; } proxy_pass http://abogados-dashboard:8082; }
 location = /api/auth/login { limit_except POST { deny all; } proxy_pass http://auth-dashboard:8081; }
 location /api/ { return 503; }
 location / { try_files $uri $uri/ /index.html; }
}
