# Independent loopback frontend. Native services retain JWT and ADMIN enforcement.
map $http_origin $admin_origin_allowed {
    default 0;
    "" 1;
    "http://localhost:5174" 1;
    "http://127.0.0.1:5174" 1;
}
server {
    listen 80;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    index admin.html;
    client_max_body_size 8m;
    if ($admin_origin_allowed = 0) { return 403; }
    # Origin checked here; upstream is a same-origin server proxy, not browser CORS.
    proxy_set_header Origin "";
    proxy_set_header Authorization $http_authorization;
    proxy_next_upstream off;
    location = /api/auth/login { proxy_pass http://autenticacion:8081; }
    location ^~ /api/admin/ciudadanos { proxy_pass http://ciudadanos:8080; }
    location ^~ /api/admin/abogados { proxy_pass http://abogados:8082; }
    location /api/ { return 404; }
    location / { try_files $uri $uri/ /admin.html; }
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
}
