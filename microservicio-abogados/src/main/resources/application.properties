spring.application.name=microservicio-abogados

# Puerto del microservicio
server.port=8082

# Base de datos PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/abogacia_abogados}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
abogados.correo.consola=${ABOGADOS_CORREO_CONSOLA:false}
abogados.padron.importar=${PADRON_IMPORTAR:false}
abogados.padron.archivo=${PADRON_ARCHIVO:../PADRON-RIO-TERCERO-ENERO.xlsx}

# Didit: API key and workflow are read from environment by DiditConfig.
# Privacy configuration is deliberately empty/blocked until an approved notice is provided.
# No webhook or public HTTPS URL is required in Stage 1.
# Prevent HTTP wire logs from disclosing authorization headers or provider data.
logging.level.org.springframework.web.client=OFF
logging.level.jdk.internal.net.http=OFF
