server {
    listen 80;
    client_max_body_size 9m;
    root /usr/share/nginx/html;
    index index.html;
    # This private same-origin proxy uses bearer tokens, never cookie sessions.
    # Strip browser Origin so the unchanged backend CORS settings do not need new ports.
    proxy_set_header Origin "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_next_upstream off;

    location = /api/auth/login {
        limit_except POST { deny all; }
        proxy_pass http://autenticacion-admin-test:8081;
    }
    location = /api/admin/abogados {
        limit_except GET { deny all; }
        proxy_pass http://abogados-admin-test:8082;
    }
    location = /api/admin/ciudadanos {
        limit_except GET { deny all; }
        proxy_pass http://ciudadanos-admin-test:8080;
    }
    location ~ ^/api/admin/abogados/(indicadores|[1-9][0-9]*/identidad)$ {
        limit_except GET { deny all; }
        proxy_pass http://abogados-admin-test:8082;
    }
    location ~ ^/api/admin/ciudadanos/(indicadores|[1-9][0-9]*/identidad)$ {
        limit_except GET { deny all; }
        proxy_pass http://ciudadanos-admin-test:8080;
    }
    location ~ ^/api/admin/ciudadanos/[1-9][0-9]*/(suspender|rehabilitar)$ {
        limit_except POST { deny all; }
        proxy_pass http://ciudadanos-admin-test:8080;
    }
    location ~ ^/api/admin/abogados/[1-9][0-9]*/(suspender|rehabilitar)$ {
        limit_except POST { deny all; }
        proxy_pass http://abogados-admin-test:8082;
    }
    location = /api/admin/abogados/padron {
        limit_except GET POST { deny all; }
        proxy_pass http://abogados-admin-test:8082;
    }
    # No registration, owner API, Didit operations, recommendations or Lexi proxy.
    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
