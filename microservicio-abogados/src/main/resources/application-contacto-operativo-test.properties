spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=false
abogados.cors.origin=http://localhost:5182,http://127.0.0.1:5182
abogados.padron.importar=false
abogados.correo.consola=false
DIDIT_RECONCILIATION_ENABLED=false
DIDIT_PRIVACY_READY=false
spring.servlet.multipart.max-request-size=16KB
logging.level.root=WARN
logging.level.org.springframework.jdbc=OFF
logging.level.org.hibernate=OFF
logging.level.org.springframework.web=OFF
logging.level.jdk.internal.net.http=OFF
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
