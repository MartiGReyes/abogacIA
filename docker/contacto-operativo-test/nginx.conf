limit_req_zone $binary_remote_addr zone=operativa:1m rate=120r/m;
server {
    listen 80;
    if ($http_host !~ "^(localhost|127\.0\.0\.1):5182$") { return 403; }
    root /usr/share/nginx/html;
    client_max_body_size 8k;
    # No bodies, query strings, invitation codes or destination links in access logs.
    access_log off;
    error_log /dev/stderr crit;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-store always;
    # Historical encrypted data is preserved; the legacy experience is inaccessible.
    location /api/pruebas-operativas/ { return 404; }
    location /api/abogados/desarrollo/ { return 404; }
    location = /api/abogados/catalogo { proxy_pass http://abogados-operativa:8082; proxy_set_header Host $http_host; }
    location = /api/abogados/recomendaciones { proxy_pass http://abogados-operativa:8082; proxy_set_header Host $http_host; }
    location = /api/abogados/contacto/whatsapp { proxy_pass http://abogados-operativa:8082; proxy_set_header Host $http_host; }
    location /api/auth/ { proxy_pass http://auth-operativa:8081; proxy_set_header Host $http_host; }
    location /api/ciudadanos/ { proxy_pass http://ciudadanos-operativa:8080; proxy_set_header Host $http_host; }
    location /api/abogados/me { proxy_pass http://abogados-operativa:8082; proxy_set_header Host $http_host; }
    # Existing chat contract; no campaign or separate conversation.
    location = /api/lexi/orientacion {
        proxy_pass http://abogados-operativa:8082/api/lexi/orientacion;
        proxy_set_header Host $http_host;
        proxy_read_timeout 70s;
        proxy_next_upstream off;
    }
    # All other APIs remain inaccessible in this isolated runtime.
    location /api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
