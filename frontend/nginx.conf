server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;
    location /api/auth/ { proxy_pass http://autenticacion:8081; }
    location /api/ciudadanos/ { proxy_pass http://ciudadanos:8080; }
    location /api/abogados/ { proxy_pass http://abogados:8082; }
    location /api/admin/ciudadanos { proxy_pass http://ciudadanos:8080; }
    location /api/admin/abogados { proxy_pass http://abogados:8082; }

    # Lexi: same-origin POST; Nginx forwards the method, JSON body and Content-Type.
    # Docker DNS resolves the service name; localhost would refer to this container.
    location = /api/lexi/orientacion {
        proxy_pass http://n8n:5678/webhook/orientacion-legal;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 65s;
        proxy_read_timeout 65s;
        # Do not retry a POST: a second execution could duplicate an AI request.
        proxy_next_upstream off;
    }

    # Rutas de React (por ejemplo /registro-abogado, a donde vuelve Didit): siempre index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos compilados llevan hash en el nombre: se pueden cachear.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
