server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Only recommendations reach the isolated backend; preserve URI and query string.
    location = /api/abogados/recomendaciones {
        proxy_pass http://abogados-dev:8082;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    # Lexi: same-origin POST; Nginx forwards the method, JSON body and Content-Type.
    # Docker DNS resolves the service name; localhost would refer to this container.
    location = /api/lexi/orientacion {
        proxy_pass http://n8n:5678/webhook/orientacion-legal;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 65s;
        proxy_read_timeout 65s;
        # Do not retry a POST: a second execution could duplicate an AI request.
        proxy_next_upstream off;
    }

    # Rutas de React (por ejemplo /registro-abogado, a donde vuelve Didit): siempre index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos compilados llevan hash en el nombre: se pueden cachear.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
