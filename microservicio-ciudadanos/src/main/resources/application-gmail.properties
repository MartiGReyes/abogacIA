# Opt-in. No se carga ni activa automaticamente.
abogacia.correo.adapter=${ABOGACIA_CORREO_ADAPTER:smtp}
abogacia.correo.enabled=${ABOGACIA_CORREO_ENABLED:false}
abogacia.correo.from=${SMTP_FROM}
abogacia.frontend.url=${ABOGACIA_FRONTEND_URL:http://localhost:5173}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.debug=false
