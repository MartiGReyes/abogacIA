spring.application.name=microservicio-autenticacion
server.port=8081
# JWT_SECRET, INTERNAL_USERNAME e INTERNAL_PASSWORD son obligatorias.
# ADMIN_MAIL y ADMIN_PASSWORD_HASH habilitan una cuenta ADMIN sin registro público.

# Bootstrap is opt-in, including beta/production.
abogacia.bootstrap.development-enabled=false
abogacia.bootstrap.safe-start=false
abogacia.bootstrap.states-enabled=false
abogacia.bootstrap.test-accounts-enabled=false
abogacia.bootstrap.schema-enabled=false
abogacia.bootstrap.padron-enabled=false
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.liquibase.enabled=false
