server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas de React (por ejemplo /registro-abogado, a donde vuelve Didit): siempre index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos compilados llevan hash en el nombre: se pueden cachear.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
