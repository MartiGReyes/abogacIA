spring.datasource.url=jdbc:h2:mem:abogados;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
INTERNAL_USERNAME=test-service
INTERNAL_PASSWORD=test-only-password
abogados.correo.consola=true
abogados.padron.importar=false
logging.level.root=WARN
DIDIT_RECONCILIATION_ENABLED=false
