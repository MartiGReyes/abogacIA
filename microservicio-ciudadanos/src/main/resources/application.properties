spring.application.name=microservicio-ciudadanos

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/abogacia_ciudadanos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# INTERNAL_USERNAME, INTERNAL_PASSWORD y JWT_SECRET se leen desde el entorno.

# Didit: API key, workflow y aviso se leen del entorno en DiditConfig (mismas variables que abogados).
# Evitar que los logs HTTP expongan headers de autorización o datos del proveedor.
logging.level.org.springframework.web.client=OFF
logging.level.jdk.internal.net.http=OFF
